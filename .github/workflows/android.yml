name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Materialize google-services.json from secret
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GS_B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_B64 belum diset — google-services.json tidak bisa dibuat."
            exit 1
          fi
          echo "$GS_B64" | base64 -d > app/google-services.json
          echo "google-services.json dibuat ($(wc -c < app/google-services.json) byte)"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: ingatservismotor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
